# Entfernt die Fusszeile "Generated by [Claude Code](https://claude.ai/code...)",
# die die Cloud-Umgebung an jeden Kommentar, Issue- und PR-Text der Routinen
# haengt. Weder attribution in .claude/settings.json noch der Prompt schalten
# sie ab, und ein PATCH aus der Cloud haengt sie wieder an. Bearbeitungen mit
# GITHUB_TOKEN loesen keinen neuen Lauf aus.
#
# Gehoert in jedes Arbeitsrepo und in die Zentrale (Journal). Anpassen: runs-on
# (self-hosted Runner, wenn das Repo einen hat).
name: autopilot-fusszeile

on:
  issue_comment:
    types: [created, edited]
  issues:
    types: [opened, edited]
  pull_request_target:
    types: [opened, edited]

permissions: {}

jobs:
  entfernen:
    if: >-
      contains(github.event.comment.body || github.event.pull_request.body || github.event.issue.body || '',
      '_Generated by [Claude Code](https://claude.ai/code')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Fusszeile entfernen
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
          PR: ${{ github.event.pull_request.number }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if [ -n "$COMMENT_ID" ]; then
            pfad="repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID"
          elif [ -n "$PR" ]; then
            pfad="repos/$GITHUB_REPOSITORY/pulls/$PR"
          else
            pfad="repos/$GITHUB_REPOSITORY/issues/$ISSUE"
          fi
          # Frisch lesen, der Text im Ereignis kann schon ueberholt sein
          gh api "$pfad" --jq '.body // ""' > alt.md
          jq -Rs 'sub("\\s*---\\s*_Generated by \\[Claude Code\\]\\(https://claude\\.ai/code[^)]*\\)_\\s*$"; "")' alt.md > neu.json
          if [ "$(jq -Rs . alt.md)" = "$(cat neu.json)" ]; then
            echo "keine Fusszeile"
            exit 0
          fi
          jq -n --slurpfile b neu.json '{body: $b[0]}' | gh api -X PATCH "$pfad" --input - > /dev/null
          echo "Fusszeile entfernt: $pfad"
